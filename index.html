<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#18271f">
  <title>Русы против всех — изометрический автобой</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <strong>РУСЫ <span>ПРОТИВ ВСЕХ</span></strong>
        <small>Изометрический автобой • прототип 0.1</small>
      </div>
      <div class="levelbox">
        <label for="level">Битва</label>
        <select id="level" aria-label="Выбрать битву"></select>
      </div>
    </header>
    <div class="summary">
      <span id="chapter">Глава 1 — Печенеги</span>
      <span id="budget">⚜ 90 / 90</span>
      <span id="battleTime">Подготовка</span>
    </div>
    <main class="field" id="field">
      <canvas id="battle" aria-label="Изометрическое поле боя. Выберите бойца ниже, коснитесь клетки своей зоны."></canvas>
      <div class="mapTitle" id="mapTitle">Степная застава</div>
      <div class="tip" id="tip">Выбери воина внизу и коснись клетки на синей половине. Повторный тап по бойцу — убрать.</div>
      <div class="camera">
        <button id="minus" aria-label="Отдалить карту">−</button><button id="plus" aria-label="Приблизить карту">+</button>
      </div>
      <div id="result" class="result hidden" role="status" aria-live="polite">
        <strong id="resultTitle"></strong><span id="resultText"></span>
      </div>
    </main>
    <footer class="controls">
      <div class="actions">
        <button id="clear" class="secondary">↻ Сброс армии</button>
        <button id="retry" class="secondary hidden">Повторить</button>
        <button id="next" class="secondary hidden">Следующая битва</button>
        <button id="fight" class="primary">⚔ В БОЙ!</button>
      </div>
      <div class="shoplabel"><span>ТВОЯ ДРУЖИНА</span><small>Покупай и расставляй бойцов до начала схватки</small></div>
      <div id="shop" class="shop" role="group" aria-label="Выбор русских воинов"></div>
    </footer>
  </div>
  <script src="./game-data.js"></script>
  <script src="./unit-renderer.js"></script>
  <script src="./game.js"></script>
</body></html>
