name: Deploy Rus prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check game and roguelike
        run: |
          for file in *.js; do node --check "$file"; done
          node tests/visual-art.cjs
          node tests/visual-ui.cjs
          node tests/roguelike.cjs
          node tests/roguelike-battle.cjs
          node tests/battle-audio.cjs
          node tests/pwa-lifecycle.cjs
          node tests/pwa-sw.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
